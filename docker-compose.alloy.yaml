services:
  site:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /workspace
    network_mode: host
    init: true
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:3000
      IS_ALLOY: ${IS_ALLOY:-false}
    volumes:
      - .:/workspace
    command: dotnet watch run --no-launch-profile
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/3000"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
