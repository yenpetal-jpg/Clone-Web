services:
  site:
    image: node:22-bookworm-slim
    working_dir: /workspace
    network_mode: host
    init: true
    environment:
      HOST: 0.0.0.0
      IS_ALLOY: ${IS_ALLOY:-false}
      PORT: 3000
    volumes:
      - .:/workspace
    command: npm run dev
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
